
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labtrack-postgres-1
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labtrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sven292005}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-labtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - labtrack-network

  api:
    image: labtrack/api:1.0.0
    container_name: labtrack-api-1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:8080"
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=labtrack_db;Username=postgres;Password=sven292005;SearchPath=public,auth,inventory,scheduling,telemetry,maintenance,financial,ai,audit}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-LabTrack.Api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-LabTrack.Client}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - labtrack-network

  ai-engine:
    image: labtrack/ai-engine:1.0.0
    container_name: labtrack-ai-1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHON_ENV: ${PYTHON_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      DB_CONNECTION_STRING: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sven292005}@postgres:5432/${POSTGRES_DB:-labtrack_db}"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - labtrack-network

  nginx:
    image: nginx:1.25-alpine
    container_name: labtrack-nginx-1
    restart: always
    depends_on:
      api:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - labtrack-network

networks:
  labtrack-network:
    driver: bridge
    name: labtrack-network

volumes:
  postgres_data:
    name: labtrack_postgres_data