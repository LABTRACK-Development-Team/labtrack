<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="JRMSU LabTrack â€” Jose Rizal Memorial State University Computer Laboratory Management & Anti-Proxy Hardware Telemetry System"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>JRMSU LabTrack | University Laboratory Control Center</title>

    <style>
      :root {
        color-scheme: dark;
        background-color: #020617;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        z-index: 9999;
        font-family: 'JetBrains Mono', monospace;
      }
      .app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(6, 182, 212, 0.15);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .app-loader-text {
        margin-top: 16px;
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950">
    <div id="root">
      <div class="app-loader" id="app-initial-loader">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">Initializing JRMSU LabTrack...</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  
    <script>
      (function() {
        var shown = false;
        function show(title, msg, stack) {
          if (shown) return;
          shown = true;
          var box = document.createElement('div');
          box.id = 'global-error-overlay';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;color:#ff5555;padding:20px;font-family:monospace;z-index:999999;overflow:auto;';
          box.innerHTML = '<h1 style="font-size:24px;color:#ff4444;">⚠️ ' + title + '</h1>' +
            '<h2 style="color:#ffaa00;margin-top:20px;">Message:</h2>' +
            '<pre style="background:#000;padding:15px;white-space:pre-wrap;border:1px solid #ff5555;border-radius:8px;font-size:14px;color:#ffaaaa;">' + (msg || '') + '</pre>' +
            '<h2 style="color:#ffaa00;margin-top:20px;">Stack:</h2>' +
            '<pre style="background:#000;padding:15px;white-space:pre-wrap;border:1px solid #666;border-radius:8px;font-size:12px;color:#cccccc;">' + (stack || 'N/A') + '</pre>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.href=\'/login/admin\';" style="margin-top:20px;padding:12px 24px;background:#cc0000;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px;">Clear &amp; Reload</button>';
          document.body.appendChild(box);
        }
        window.addEventListener('error', function(e) {
          show('Global Error', e.message || 'Unknown error', (e.error && e.error.stack) || (e.filename + ':' + e.lineno));
        });
        window.addEventListener('unhandledrejection', function(e) {
          show('Unhandled Promise Rejection', (e.reason && e.reason.message) || String(e.reason), (e.reason && e.reason.stack) || 'N/A');
        });
      })();
    </script>

</body>
</html>
